name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Jellyfin.Plugin.ComicInfoExtras.Tests
      - run: dotnet publish Jellyfin.Plugin.ComicInfoExtras -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: comicinfo-extras
          path: out/Jellyfin.Plugin.ComicInfoExtras.dll
