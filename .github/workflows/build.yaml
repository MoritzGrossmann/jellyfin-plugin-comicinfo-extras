# Build/test on every push & PR. On a published GitHub Release the plugin is also packaged, attached
# to the release and added to the plugin repository manifests in this repo.
#
# Version source of truth: build.yaml. Two channels:
#   - stable:   GitHub Release, version revision .0  (e.g. 1.2.0.0) -> manifest.json + manifest-beta.json
#   - beta:     GitHub pre-release, revision >= .1   (e.g. 1.2.0.1) -> manifest-beta.json only
name: build

on:
  push:
    branches: [ master ]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    paths-ignore: [ '**/*.md' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JELLYFIN_VERSION: "12.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catch "tagged before bumping build.yaml": the tag (minus the leading v) must equal build.yaml's version.
      - name: Guard - release tag matches build.yaml version
        if: github.event_name == 'release'
        run: |
          version=$(grep -m1 '^version:' build.yaml | cut -d'"' -f2)
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag v$tag does not match build.yaml version $version. Bump build.yaml (and commit) before tagging."
            exit 1
          fi

      # Keep the two channels strictly ordered: stable = revision .0, pre-release = revision >= .1.
      - name: Guard - version revision matches release channel
        if: github.event_name == 'release'
        run: |
          version=$(grep -m1 '^version:' build.yaml | cut -d'"' -f2)
          rev=$(echo "$version" | cut -d. -f4)
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            [ "$rev" != "0" ] || { echo "::error::Pre-release $version ends in .0; a beta must use a non-zero revision (e.g. 1.2.0.1)."; exit 1; }
          else
            [ "$rev" = "0" ] || { echo "::error::Stable release $version ends in .$rev; a stable release must end in .0. Mark it as a pre-release or bump to a .0 version."; exit 1; }
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Runs the tests, publishes and writes dist/comicinfo-extras_<version>.zip (DLL + meta.json).
      - name: Test and package
        run: sh scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: comicinfo-extras
          path: dist/*.zip

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          name: comicinfo-extras
          path: artifacts

      - name: Attach zip and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          pipx install jprm
          [ -f ./manifest.json ] || jprm repo init ./manifest.json
          [ -f ./manifest-beta.json ] || jprm repo init ./manifest-beta.json
          for zip in artifacts/*.zip; do
            url="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$(basename "$zip")"
            gh release upload "${{ github.event.release.tag_name }}" "$zip" --clobber
            # The beta channel gets every release; the stable channel only non-prereleases.
            jprm repo add --plugin-url "$url" ./manifest-beta.json "$zip"
            if [ "$PRERELEASE" != "true" ]; then
              jprm repo add --plugin-url "$url" ./manifest.json "$zip"
            fi
          done

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-beta.json
          git diff --cached --quiet || git commit -m "Publish manifests for ${{ github.event.release.tag_name }}"
          git push
