framework: "net10.0"
overview: "Tags, AgeRating, CommunityRating, Characters, SeriesGroup and sort title from ComicInfo.xml for books"
description: >
  Adds the ComicInfo.xml fields Tags, AgeRating, CommunityRating, Characters and SeriesGroup to books,
  which Jellyfin does not read itself. AgeRating is mapped to FSK or US levels,
  CommunityRating is doubled from ComicInfo's 0 to 5 scale to Jellyfin's 0 to 10,
  Characters are added as cast, Series is used as the sort title,
  SeriesGroup is created as a tag and/or collection.
category: "Metadata"
owner: "moritz"
artifacts:
- "Jellyfin.Plugin.ComicInfoExtras.dll"
changelog: >
  Series from ComicInfo.xml is now set as the sort title ("Sort by title"), so books sort by it.
  Can be turned off in the settings.
