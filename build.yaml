overview: "Tags, AgeRating, CommunityRating, Characters and SeriesGroup from ComicInfo.xml for books"
description: >
  Adds the ComicInfo.xml fields Tags, AgeRating, CommunityRating, Characters and SeriesGroup to books,
  which Jellyfin does not read itself. AgeRating is mapped to FSK or US levels,
  CommunityRating is doubled from ComicInfo's 0 to 5 scale to Jellyfin's 0 to 10,
  Characters are added as cast, SeriesGroup is created as a tag and/or collection.
category: "Metadata"
owner: "moritz"
artifacts:
- "Jellyfin.Plugin.ComicInfoExtras.dll"
changelog: >
  Fixes the Characters import: Jellyfin overwrote the cast after the plugin had set it, so no characters
  appeared. They are now applied right after a book is saved.
